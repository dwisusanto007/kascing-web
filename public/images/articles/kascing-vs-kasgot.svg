<svg viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi cacing tanah dan larva BSF berdampingan, mewakili kascing versus kasgot">
  <rect width="120" height="160" fill="#ecfdf5" />
  <rect x="120" width="120" height="160" fill="#fffbeb" />

  <!-- soil mounds -->
  <path d="M0 136c18-10 38-10 58 0s42 10 62 0v24H0Z" fill="#a7f3d0" />
  <path d="M118 136c18-10 40-10 60 0s42 10 62 0v24H118Z" fill="#fde68a" />

  <!-- earthworm (kascing side): open wavy body, no self-crossing -->
  <path
    d="M22 128C34 112 10 100 24 82C38 64 14 54 30 36"
    fill="none"
    stroke="#e8795a"
    stroke-width="13"
    stroke-linecap="round"
  />
  <!-- segment ticks along the body -->
  <path
    d="M27 120l-7 4M30 106l-8 3M22 92l-8 2M27 78l-8 3M30 64l-8 2M24 50l-8 3"
    stroke="#c75a3c"
    stroke-width="2.5"
    stroke-linecap="round"
  />
  <!-- head (lighter band near the top end) -->
  <circle cx="30" cy="36" r="8" fill="#f2a688" />

  <!-- larva BSF (kasgot side) -->
  <path d="M166 112c0-18 11-30 26-30s26 11 26 28-11 26-26 26-26-7-26-24Z" fill="#cdae7d" />
  <path
    d="M171 98c4 3 4 26 0 30M182 93c4 3 4 34 0 38M193 91c4 3 4 38 0 42M204 93c4 3 4 34 0 38M214 98c3 3 3 26 0 30"
    stroke="#a98657"
    stroke-width="2.5"
    stroke-linecap="round"
    fill="none"
  />
  <circle cx="168" cy="99" r="7.5" fill="#4b3621" />

  <!-- vs badge -->
  <circle cx="120" cy="56" r="19" fill="#ffffff" stroke="#059669" stroke-width="3" />
  <text x="120" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#059669">VS</text>

  <!-- leaf accents -->
  <path d="M90 128c6-7 17-7 22 0-6 7-17 7-22 0Z" fill="#34d399" />
  <path d="M128 128c6-7 17-7 22 0-6 7-17 7-22 0Z" fill="#fbbf24" />
</svg>
